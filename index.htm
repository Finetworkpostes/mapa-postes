<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medidor de Distancia (Postes y Vivienda)</title>

    <!-- 1. Estilos de Leaflet (para el mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- 2. Estilos del Geocoder (para la barra de búsqueda) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

    <!-- 3. TailwindCSS (para la UI) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 4. Estilos personalizados -->
    <style>
        html,
        body {
            height: 100vh;
            /* Altura total de la ventana */
            margin: 100;
            padding: 100;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            /* Evita barras de scroll en el body */
        }

        #map-container {
            flex-grow: 5;
            /* Hace que este div ocupe todo el espacio sobrante */
            position: relative;
            /* Necesario para que el mapa sepa su tamaño */
        }

        #map {
            height: 100%;
            /* El mapa llena su contenedor */
            width: 100%;
            z-index: 0;
        }

        #info-panel {
            flex-shrink: 0;
            /* Evita que el panel se encoja */
            overflow-y: auto;
            /* Scroll si hay muchas mediciones */
            box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.1);
            /* --- CAMBIO AQUÍ --- */
            height: 300px;
            /* Altura reducida para dar más espacio al mapa */
        }

        /* Estilos para los iconos SVG personalizados */
        .custom-div-icon {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 32px;
            height: 32px;
        }

        .custom-div-icon svg {
            width: 100%;
            height: 100%;
        }

        /* Estilos para botones deshabilitados */
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Ocultar UI al imprimir */
        @media print {
            body {
                display: block;
                height: auto;
                overflow: visible;
            }

            #map-container {
                height: 60vh !important;
            }

            #map {
                height: 60% !important;
            }

            #print-button,
            #undo-button,
            #reset-button,
            .leaflet-control-container {
                display: none !important;
            }

            #info-panel {
                height: auto !important;
                overflow: visible !important;
                box-shadow: none !important;
                border: 1px solid #ccc;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            #total-distance {
                background-color: #f3f4f6 !important;
            }
        }
    </style>
</head>

<body class="flex flex-col h-screen">

    <!-- Contenedor del mapa (crece para llenar el espacio) -->
    <div id="map-container">
        <div id="map"></div>
    </div>

    <!-- Panel de Información (Debajo del mapa) -->
    <!-- --- CAMBIO AQUÍ (p-2) --- -->
    <div id="info-panel" class="w-full p-2 bg-white z-10 border-t-2 border-gray-200">

        <!-- Contenedor para las dos columnas (se apila en móvil) -->
        <!-- --- CAMBIO AQUÍ (gap-2) --- -->
        <div class="flex flex-col md:flex-row gap-2">

            <!-- Columna de lista de distancias -->
            <div id="distances-list" class="flex-1 text-gray-700">
                <!-- --- CAMBIO AQUÍ (mb-1) --- -->
                <h2 class="text-lg font-bold mb-1 text-gray-800">Mediciones</h2>
                <p class="italic text-sm">Haz clic en el mapa para añadir el primer "POSTE", siempre se empezara desde la CTO hasta la VIVIENDA.</p>
            </div>

            <!-- Columna de distancia total y botones de acción -->
            <div class="flex-shrink-0 w-full md:w-1/3">

                <!-- Distancia Total -->
                <!-- --- CAMBIO AQUÍ (p-1.5) --- -->
                <div id="total-distance" class="text-md font-semibold text-gray-900 bg-gray-100 p-1.5 rounded-lg text-center md:text-right">
                    Distancia Total: 0.00 metros
                </div>

                <!-- Botones de Acción (Vertical stack) -->
                <!-- --- CAMBIO AQUÍ (mt-1.5, space-y-1.5) --- -->
                <div class="mt-1.5 space-y-1.5">
                    <!-- Botón Imprimir -->
                    <!-- --- CAMBIO AQUÍ (py-1.5) --- -->
                    <button id="print-button" class="w-full text-sm py-1.5 px-3 rounded-lg shadow-md flex items-center justify-center bg-blue-600 text-white hover:bg-blue-700">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2">
                            <polyline points="6 9 6 2 18 2 18 9"></polyline>
                            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                            <rect x="6" y="14" width="12" height="8"></rect>
                        </svg>
                        Imprimir Mapa
                    </button>
                    <!-- Botón Deshacer -->
                    <!-- --- CAMBIO AQUÍ (py-1.5) --- -->
                    <button id="undo-button" class="w-full text-sm py-1.5 px-3 rounded-lg shadow-md flex items-center justify-center bg-yellow-500 text-white hover:bg-yellow-600">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2">
                            <path d="M3 3v6h6"></path>
                            <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
                        </svg>
                        Eliminar Último
                    </button>
                    <!-- Botón Reiniciar -->
                    <!-- --- CAMBIO AQUÍ (py-1.5) --- -->
                    <button id="reset-button" class="w-full text-sm py-1.5 px-3 rounded-lg shadow-md flex items-center justify-center bg-red-600 text-white hover:bg-red-700">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            <line x1="10" y1="11" x2="10" y2="17"></line>
                            <line x1="14" y1="11" x2="14" y2="17"></line>
                        </svg>
                        Reiniciar Todo
                    </button>
                </div>
            </div>
        </div>
    </div>


    <!-- 5. Script de Leaflet (para el mapa) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- 6. Script del Geocoder (para la barra de búsqueda) -->
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <!-- 7. Lógica principal de la aplicación (Sin cambios en el JS) -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // --- 1. DEFINICIÓN DE ICONOS ---
            const posteIconSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="color: purple; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));"><path fill-rule="evenodd" d="M11.54 22.351l.07.04.028.016a.76.76 0 00.723 0l.028-.015.071-.041A1.5 1.5 0 0014.02 21.5V17.375a2.25 2.25 0 00-2.25-2.25h-1.5a2.25 2.25 0 00-2.25 2.25V21.5c0 .414.168.79.44 1.069l.07.04.028.016a.76.76 0 00.723 0l.028-.015.071-.04A1.5 1.5 0 0010.02 21.5V17.375a.75.75 0 01.75-.75h1.5a.75.75 0 01.75.75V21.5a1.5 1.5 0 00.52 1.069zM12 1.5a6.75 6.75 0 00-6.75 6.75c0 4.5 4.125 10.336 6.362 12.507a.75.75 0 001.076 0C14.624 18.586 18.75 12.75 18.75 8.25A6.75 6.75 0 0012 1.5zm0 9a2.25 2.25 0 100-4.5 2.25 2.25 0 000 4.5z" clip-rule="evenodd" /></svg>`;
            const viviendaIconSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="color: #4A90E2; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));"><path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0L2.47 11.47a.75.75 0 101.06 1.06l8.69-8.69z" /><path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.43z" /></svg>`;

            const posteIcon = L.divIcon({
                html: posteIconSVG,
                className: 'custom-div-icon',
                iconSize: [32, 32],
                iconAnchor: [16, 32],
                popupAnchor: [0, -32]
            });
            const viviendaIcon = L.divIcon({
                html: viviendaIconSVG,
                className: 'custom-div-icon',
                iconSize: [32, 32],
                iconAnchor: [16, 32],
                popupAnchor: [0, -32]
            });

            // --- 2. INICIALIZACIÓN DEL MAPA ---
            const map = L.map('map').setView([40.416775, -3.703790], 6);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
            }).addTo(map);

            // --- 3. BÚSQUEDA DE DIRECCIONES (GEOCODER) ---
            const geocoder = L.Control.geocoder({
                defaultMarkGeocode: false,
                placeholder: 'Buscar dirección en España...',
                geocoder: L.Control.Geocoder.nominatim({
                    geocodingQueryParams: {
                        'countrycodes': 'es',
                        'viewbox': '-9.5,36.0,3.5,43.8'
                    }
                })
            }).on('markgeocode', function(e) {
                map.fitBounds(e.geocode.bbox);
            }).addTo(map);

            // --- 4. LÓGICA DE PUNTOS Y DISTANCIAS ---
            let points = [];
            let polyline = L.polyline([], {
                color: 'purple',
                weight: 3
            }).addTo(map);
            let markerLayer = L.layerGroup().addTo(map);

            // Elementos de la UI
            const distancesListPanel = document.getElementById('distances-list');
            const totalDistancePanel = document.getElementById('total-distance');
            const printButton = document.getElementById('print-button');
            const undoButton = document.getElementById('undo-button');
            const resetButton = document.getElementById('reset-button');

            // --- 5. EVENT LISTENERS ---
            map.on('click', function(e) {
                const newPoint = {
                    latLng: e.latlng,
                    marker: null,
                    type: 'POSTE'
                };
                points.push(newPoint);
                updateMapAndDistances();
            });
                
                printButton.addEventListener('click', function() {
                // Al imprimir, ajustamos la vista para que todos los puntos quepan.
                if (points.length > 0) {
                    const latLngs = points.map(p => p.latLng);
                    map.fitBounds(L.latLngBounds(latLngs), { padding: [20, 20] });
                }
                
                // Forzar un re-dibujado del mapa antes de imprimir (redundante pero seguro)
                map.invalidateSize(); 
                setTimeout(() => window.print(), 100); 
            });



            undoButton.addEventListener('click', function() {
                points.pop();
                updateMapAndDistances();
            });

            resetButton.addEventListener('click', function() {
                points = [];
                updateMapAndDistances();
            });

            // --- 6. FUNCIÓN PRINCIPAL DE ACTUALIZACIÓN ---
            function updateMapAndDistances() {

                markerLayer.clearLayers();
                distancesListPanel.innerHTML = '';

                if (points.length === 0) {
                    distancesListPanel.innerHTML = '<p class="italic text-sm">Haz clic en el mapa para añadir el primer "POSTE".</p>';
                    totalDistancePanel.textContent = 'Distancia Total: 0.00 metros';
                    polyline.setLatLngs([]);

                    printButton.disabled = true;
                    undoButton.disabled = true;
                    resetButton.disabled = true;
                    return;
                }

                printButton.disabled = false;
                undoButton.disabled = false;
                resetButton.disabled = false;

                let totalDistance = 0;
                let polylineLatLngs = [];
                let distancesHTML = '<ul class="space-y-1 list-disc list-inside text-sm">';

                points.forEach((point, index) => {

                    const isLastPoint = (index === points.length - 1);
                    point.type = isLastPoint ? 'VIVIENDA' : 'POSTE';
                    const icon = isLastPoint ? viviendaIcon : posteIcon;

                    point.marker = L.marker(point.latLng, {
                            icon: icon
                        })
                        .bindPopup(`<b>${point.type} ${index + 1}</b><br>Lat: ${point.latLng.lat.toFixed(5)}<br>Lng: ${point.latLng.lng.toFixed(5)}`);

                    markerLayer.addLayer(point.marker);

                    polylineLatLngs.push(point.latLng);

                    if (index > 0) {
                        const prevPoint = points[index - 1];
                        const distance = point.latLng.distanceTo(prevPoint.latLng); // en metros
                        totalDistance += distance;

                        distancesHTML += `<li>${prevPoint.type} ${index} a ${point.type} ${index + 1}: <span class="font-semibold">${distance.toFixed(2)} m</span></li>`;
                    }
                });

                distancesHTML += '</ul>';

                distancesListPanel.innerHTML = distancesHTML;
                totalDistancePanel.textContent = `Distancia Total: ${totalDistance.toFixed(2)} metros`;
                polyline.setLatLngs(polylineLatLngs);
            }

            // --- 7. LLAMADA INICIAL ---
            updateMapAndDistances();
        });
    </script>
</body>

</html>
